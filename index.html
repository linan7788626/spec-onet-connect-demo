<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>天体谱线连连看</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230d1424'/%3E%3Cpath d='M6 46 Q20 46 25 18 Q30 46 58 46' fill='none' stroke='%2342a5f5' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--S:100px;--ink:#e8eef8;--sub:#93a2ba;}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;}
html,body{min-height:100%;}
body{
  background:#070b16;
  background-image:
    radial-gradient(1.2px 1.2px at 12% 22%, rgba(255,255,255,.8) 45%, transparent 55%),
    radial-gradient(1px 1px at 28% 68%, rgba(255,255,255,.6) 45%, transparent 55%),
    radial-gradient(1.4px 1.4px at 55% 12%, rgba(255,255,255,.7) 45%, transparent 55%),
    radial-gradient(1px 1px at 72% 40%, rgba(255,255,255,.55) 45%, transparent 55%),
    radial-gradient(1.2px 1.2px at 86% 76%, rgba(255,255,255,.7) 45%, transparent 55%),
    radial-gradient(1px 1px at 40% 88%, rgba(255,255,255,.5) 45%, transparent 55%),
    radial-gradient(1px 1px at 64% 60%, rgba(255,255,255,.4) 45%, transparent 55%),
    radial-gradient(1100px 550px at 50% -10%, #1b2a52 0%, transparent 60%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:16px 10px 30px;overflow-x:hidden;
}
header{text-align:center;}
h1{font-size:32px;letter-spacing:3px;font-weight:800;
  background:linear-gradient(90deg,#ef5350,#ff9800,#fdd835,#66bb6a,#42a5f5,#ba68c8);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.sub{font-size:16px;color:var(--sub);margin-top:5px;}
#hud{display:flex;gap:20px;font-size:17px;color:var(--sub);flex-wrap:wrap;justify-content:center;}
#hud b{color:#fff;font-variant-numeric:tabular-nums;margin-left:4px;}
#btns,#mBtns{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;}
.panel{background:rgba(15,24,44,.72);border:1px solid #26324e;border-radius:14px;padding:10px 24px;}
#topbar{display:flex;flex-direction:column;gap:10px;align-items:center;padding:12px 30px;}
#mBtns{background:rgba(15,24,44,.72);border:1px solid #26324e;border-radius:14px;padding:11px 24px;}
button{background:#141f3a;border:1px solid #33456e;color:#dbe5f5;border-radius:999px;padding:8px 18px;font-size:16px;cursor:pointer;font-family:inherit;}
button:hover{background:#1c2b50;border-color:#4a619a;}
button.big{padding:11px 24px;font-size:18px;}
button.big:disabled{opacity:.45;cursor:default;}
button.primary{background:#22406f;border-color:#5b8ad6;color:#eaf2ff;}
.screen{display:none;flex-direction:column;align-items:center;gap:12px;width:100%;}
.screen.on{display:flex;}
#mProg{font-size:17px;color:var(--sub);background:rgba(15,24,44,.85);border:1px solid #26324e;border-radius:12px;padding:11px 20px;}
#mProg b{color:#ffe082;font-variant-numeric:tabular-nums;}
.chapters{display:flex;flex-direction:column;gap:12px;width:min(860px,94vw);}
.chp{background:rgba(15,24,44,.72);border:1px solid #26324e;border-radius:14px;padding:12px 14px;}
.chname{font-size:15px;color:var(--sub);margin-bottom:10px;}
.lvls{display:flex;gap:10px;}
.lvl{flex:1;padding:12px 6px;border-radius:12px;text-align:center;font-size:14.5px;line-height:1.35;font-weight:700;}
.lvl small{display:block;font-size:12px;color:var(--sub);font-weight:400;margin-top:3px;}
.lvl.cur{border-color:#ffe082;box-shadow:0 0 10px rgba(255,224,130,.35);}
.lvl.done{border-color:#3f6e52;}
.lvl.lock{opacity:.42;}
.st{color:#ffd54f;}
#boardBox{position:relative;touch-action:manipulation;border:1px solid #2a3a5e;border-radius:16px;background:rgba(9,14,28,.62);}
#pathLayer{position:absolute;pointer-events:none;overflow:visible;z-index:30;}
.tile{position:absolute;display:flex;flex-direction:column;gap:3px;padding:6px 7px 5px;font-size:calc(var(--ts,84px)*0.19);
  border:2px solid var(--bc);border-radius:10px;
  background:linear-gradient(165deg,var(--bt),#0c1220 70%);
  cursor:pointer;transition:transform .28s,opacity .28s,box-shadow .15s,filter .15s;}
.tile:hover{filter:brightness(1.18);}
.tile.sel{box-shadow:0 0 0 2px #fff,0 0 16px var(--bc);z-index:5;}
.tile.hint{animation:hintp .55s infinite alternate;}
.tile.dead{transform:scale(.15);opacity:0;pointer-events:none;}
.tile.pop{animation:pop .3s both;}
.tile.pre{animation:deal .35s both;}
.tile.shake{animation:shake .3s;}
.tname{font-weight:700;font-size:1em;line-height:1.15;white-space:nowrap;overflow:hidden;text-shadow:0 0 6px rgba(0,0,0,.6);}
.tname.sm{font-size:.85em;padding-top:1px;}
.prof{flex:1;min-height:0;width:100%;}
.prof line{stroke:rgba(255,255,255,.15);stroke-dasharray:3 3;}
.prof path{fill:none;stroke:var(--bc);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
.em{position:relative;height:3px;border-radius:2px;margin:0 1px;
  background:linear-gradient(90deg,#ef5350,#ff9800,#fdd835,#66bb6a,#42a5f5,#ba68c8);}
.em i{position:absolute;top:-2px;width:2px;height:7px;background:#fff;border-radius:1px;box-shadow:0 0 4px #fff;}
.tf{display:flex;justify-content:space-between;align-items:center;gap:.2em;overflow:hidden;}
.chip{font-size:.5em;font-weight:700;color:#0a0f1c;padding:.12em .35em;border-radius:4px;line-height:1.4;white-space:nowrap;flex:none;}
.wv{font-size:.5em;color:#9fb0c8;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;}
.nonames .tname,.nonames .wv{visibility:hidden;}
polyline.trace{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;animation:tr .55s ease forwards;}
#gameMain{display:flex;gap:14px;align-items:flex-start;justify-content:center;flex-wrap:wrap;}
.spSide{width:330px;background:rgba(15,24,44,.85);border:1px solid #26324e;border-radius:14px;padding:5px 17px;font-size:15.5px;line-height:1.7;color:#c7d2e4;max-height:780px;overflow:auto;}
.spSecTitle{font-size:13px;color:var(--sub);letter-spacing:1.5px;margin-bottom:8px;}
.spBand{margin-bottom:5px;}
.spBadge{display:inline-block;font-size:17px;font-weight:800;padding:2px 12px;border-radius:999px;line-height:1.5;}
.spPool{display:flex;flex-wrap:wrap;gap:6px;}
.spPool .spBadge{font-size:13.5px;padding:2px 9px;font-weight:700;}
.spName{font-weight:800;font-size:22px;margin-bottom:4px;}
.spName .wv{font-size:14px;font-weight:400;margin-left:8px;}
.spDesc{font-size:14.5px;color:#9fb0c8;margin:1px 0 4px;}
.spMod{margin-top:8px;padding-top:7px;border-top:1px dashed #2a3a5e;}
.spMod i{font-style:normal;font-weight:700;margin-right:8px;}
#legend{display:flex;flex-wrap:wrap;gap:7px 18px;justify-content:center;font-size:14.5px;color:var(--sub);max-width:1100px;background:rgba(15,24,44,.72);border:1px solid #26324e;border-radius:14px;padding:11px 26px;}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
.lg em{font-style:normal;color:#6b7a94;margin-left:4px;}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-8px);background:rgba(28,43,80,.95);
 border:1px solid #4a619a;color:#e8eef8;padding:10px 22px;border-radius:999px;font-size:16px;opacity:0;pointer-events:none;transition:.25s;z-index:110;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.fscore{position:absolute;font-weight:800;color:#ffe082;text-shadow:0 2px 8px rgba(0,0,0,.6);font-size:20px;pointer-events:none;animation:rise .9s forwards;z-index:40;}
.ovl{position:fixed;inset:0;background:rgba(4,7,14,.82);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;}
.ovl.show{display:flex;}
.ovl .card{background:#0f1930;border:1px solid #33456e;border-radius:20px;padding:32px 40px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:90vh;overflow:auto;max-width:94vw;}
.ovl h2{font-size:27px;margin-bottom:12px;}
.ovl .res{color:var(--sub);font-size:16px;margin-bottom:16px;line-height:1.75;}
.ovl .res b{color:#ffe082;}
.qcard{width:min(660px,94vw);text-align:left;}
.qhead{display:flex;justify-content:space-between;font-size:14.5px;color:var(--sub);margin-bottom:12px;}
.qtext{font-size:19px;line-height:1.7;margin:4px 0 16px;}
.qopt{display:block;width:100%;text-align:left;margin-bottom:11px;padding:13px 17px;border-radius:12px;font-size:16.5px;line-height:1.45;}
.qopt.ok{background:#173a22;border-color:#66bb6a;color:#c8f0ce;}
.qopt.bad{background:#3a1717;border-color:#ef5350;color:#f2c6c6;}
.qopt:disabled{cursor:default;opacity:1;}
.qwhy{min-height:48px;font-size:14.5px;color:#9fb0c8;line-height:1.6;margin:4px 0 14px;}
#qNext{display:none;width:100%;}
.apanel{width:min(920px,94vw);}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:12px;margin-bottom:16px;}
.acard{border:2px solid var(--bc);border-radius:12px;padding:9px 9px 8px;background:linear-gradient(165deg,var(--bt),#0c1220 70%);cursor:pointer;text-align:center;transition:filter .15s;}
.acard:hover{filter:brightness(1.2);}
.acard.lock{filter:grayscale(.85) brightness(.5);cursor:default;}
.acard.wait{filter:grayscale(.55) brightness(.72);}
.acard.lock:hover,.acard.wait:hover{filter:grayscale(.85) brightness(.5);}
.acard .aname{font-weight:700;font-size:14.5px;margin-bottom:5px;white-space:nowrap;overflow:hidden;}
.acard .prof{height:32px;flex:none;}
.acard .afoot{font-size:12.5px;color:#9fb0c8;margin-top:5px;}
.bigcard{border:2px solid var(--bc);background:linear-gradient(165deg,var(--bt),#0c1220 70%);border-radius:16px;padding:16px 18px 12px;width:min(430px,84vw);text-align:left;margin:0 auto 16px;}
.bigcard .cname{font-weight:800;font-size:22px;margin:2px 0 8px;}
.bigcard .prof{height:88px;flex:none;}
.bigcard .cb{font-size:15px;line-height:1.75;color:#c7d2e4;margin-top:10px;}
.bigcard .cb p{margin:2px 0;}
.bigcard .cb i{font-style:normal;font-weight:700;margin-right:6px;color:var(--bc);}
@keyframes deal{from{transform:scale(.2);opacity:0;}to{transform:scale(1);opacity:1;}}
@keyframes pop{0%{transform:scale(1);}50%{transform:scale(.9);}100%{transform:scale(1);}}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
@keyframes hintp{from{box-shadow:0 0 0 2px rgba(255,235,59,.9),0 0 12px rgba(255,235,59,.6);}to{box-shadow:0 0 0 2px rgba(255,235,59,.15),0 0 4px rgba(255,235,59,.2);}}
@keyframes tr{0%{stroke-dashoffset:1;opacity:1;}70%{stroke-dashoffset:0;opacity:1;}100%{stroke-dashoffset:0;opacity:0;}}
@keyframes rise{from{transform:translate(-50%,0);opacity:1;}to{transform:translate(-50%,-28px);opacity:0;}}
</style>
</head>
<body>
<div id="menu" class="screen on">
  <header>
    <h1>天体谱线连连看</h1>
    <div class="sub">闯关 → 集卡 → 问答 · 集齐 20 卡解锁挑战</div>
  </header>
  <div id="mProg"></div>
  <div id="mBtns">
    <button id="btnPlay" class="big primary"></button>
    <button id="btnAtlas" class="big">谱线图集</button>
    <button id="btnChallenge" class="big"></button>
    <button id="btnSoundM" class="big">音效 开</button>
    <button id="btnReset" class="big">重置进度</button>
  </div>
  <div id="mGrid" class="chapters"></div>
</div>

<div id="game" class="screen">
  <header>
    <h1 id="gTitle" style="font-size:28px"></h1>
    <div class="sub" id="gSub"></div>
  </header>
  <div id="topbar" class="panel">
  <div id="hud">
    <span>时间<b id="hTime">00:00</b></span>
    <span>剩余<b id="hLeft">0</b>对</span>
    <span>得分<b id="hScore">0</b></span>
    <span>连击<b id="hCombo">—</b></span>
  </div>
  <div id="btns">
    <button id="btnHint">提示 ×3</button>
    <button id="btnShuffle">洗牌 ×3</button>
    <button id="btnSound">音效 开</button>
    <button id="btnNames">名称 开</button>
    <button id="btnZoomIn">放大 +</button>
    <button id="btnZoomOut">缩小 −</button>
    <button id="btnRestart">重开本局</button>
    <button id="btnBack">返回菜单</button>
  </div>
  </div>
  <div id="gameMain">
    <aside id="spLeft" class="spSide"></aside>
    <div id="boardBox"><svg id="pathLayer"></svg></div>
    <aside id="spTarget" class="spSide"></aside>
  </div>
  <div id="legend"></div>
</div>

<div id="cardOvl" class="ovl"><div class="card">
  <h2>获得新谱线卡！</h2>
  <div class="res">完成问答即可收入图鉴</div>
  <div id="crCard"></div>
  <button id="crGo" class="big primary">开始问答</button>
</div></div>

<div id="quizOvl" class="ovl"><div class="card qcard">
  <div class="qhead"><span id="qStep"></span><span class="st" id="qScore"></span></div>
  <div id="qText" class="qtext"></div>
  <div id="qOpts"></div>
  <div id="qWhy" class="qwhy"></div>
  <button id="qNext" class="big primary">下一题</button>
</div></div>

<div id="atlasOvl" class="ovl"><div class="card apanel">
  <h2>谱线图集</h2>
  <div class="res" id="atProg"></div>
  <div id="atGrid" class="acards"></div>
  <button id="atClose" class="big">关闭</button>
</div></div>

<div id="detailOvl" class="ovl"><div class="card">
  <div id="dtCard"></div>
  <div id="dtBtns" style="display:flex;gap:10px;justify-content:center"></div>
</div></div>

<div id="resultOvl" class="ovl"><div class="card">
  <h2 id="rTitle"></h2>
  <div class="res" id="rBody"></div>
  <div id="rBtns" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"></div>
</div></div>

<div id="toast"></div>
<script>
'use strict';
let ROWS=8,COLS=8,R=10,C=10;
const KEY='tlx_lianliankan_v1';
const BANDS={
 radio:{name:'射电',color:'#c62828',ink:'#fff',range:'λ > 1 cm'},
 mm:{name:'毫米',color:'#ff9800',range:'0.3–10 mm'},
 ir:{name:'红外',color:'#f4511e',range:'0.75–300 μm'},

 x:{name:'X射线',color:'#ce93d8',range:'0.01–10 nm'}
};
const BANDFREQ={radio:175,mm:262,ir:392,op:523,uv:740,x:1047};
const LINES=[
 {name:'HI 21cm',tc:'#ff8a80',wave:'1420 MHz',wl:'2.1×10⁵ μm（1420 MHz）',band:'radio',pos:3,profile:[{s:1,c:0.32,w:0.16,a:0.85},{s:1,c:0.68,w:0.16,a:0.80}],
  desc:'中性氢 21cm 超精细结构跃迁，示踪星系原子气体；星系积分谱常呈双峰驼背形。',tip:'中性氢 / 暗物质',lw:'窄（FWHM ~1–10 km/s）；DLA 阻尼翼极宽',traces:'中性原子氢气体',apply:'旋转曲线→暗物质；气体质量；红移测距',fact:'来自基态超精细结构，是宇宙中信息量最大的谱线之一',
  quiz:[
   {q:'HI 21cm 线来自什么物理过程？',opts:['电子从 n=2 跳回 n=1','氢原子基态超精细结构（自旋翻转）','分子转动跃迁','轫致辐射'],ans:1,why:'质子与电子自旋平行/反平行的微小能差对应 1420 MHz。'},
   {q:'用 21cm 测星系旋转曲线，发现外侧速度不下降，由此推论？',opts:['星系正在瓦解','存在暗物质晕','牛顿力学失效','望远镜系统误差'],ans:1,why:'平坦旋转曲线暗示大量不可见质量——暗物质的经典证据。'},
   {q:'星系 HI 积分谱常呈双峰，原因是？',opts:['两条不同的谱线','星系盘两侧气体分别接近/远离我们','maser 干涉','仪器偏振效应'],ans:1,why:'旋转盘的红移侧与蓝移侧各自聚成一个峰。'},
   {q:'星系 HI 积分谱宽度常达数百 km/s，主导致宽机制是？',opts:['热运动','湍流','星系盘整体转动','仪器分辨率'],ans:2,why:'中性云本身冷而窄，积分谱宽由盘的旋转主导。'}
  ]},
 {name:'OH maser',tc:'#82b1ff',wave:'1667 MHz',wl:'1.8×10⁵ μm（1667 MHz）',band:'radio',pos:5,profile:[{g:1,c:0.50,w:0.013,a:1.0},{g:1,c:0.64,w:0.011,a:0.5}],
  desc:'羟基分子 maser（受激发射），见于恒星形成区与晚型星包层，谱线极窄且强。',tip:'受激发射',lw:'极窄（kHz 量级，受激发射增益变窄）',traces:'受激发射的羟基分子云团',apply:'maser 视差精测距离；megamaser 示踪星系并合',fact:'宇宙级"激光"，线宽可窄至 kHz 量级',
  quiz:[
   {q:'maser 谱线与普通热谱线的最大区别？',opts:['更宽更弱','受激发射、极窄且极亮','只存在于射电波段','来自原子而非分子'],ans:1,why:'粒子数反转下的受激发射类似激光，亮度温度极高。'},
   {q:'维持天体 maser 需要什么条件？',opts:['极端高温','泵浦机制维持粒子数反转','强引力透镜','气体完全电离'],ans:1,why:'红外辐射、碰撞等泵浦不断把分子抽到高能级。'},
   {q:'OH megamaser 常见于哪类系统？',opts:['椭圆星系中心','星系并合/星暴系统','球状星团','行星状星云'],ans:1,why:'并合触发星暴，提供强烈的红外泵浦场。'},
   {q:'OH maser 线宽可窄至 kHz 量级，原因是？',opts:['气体温度接近绝对零度','受激发射的增益变窄','引力红移抵消','多普勒速度为零'],ans:1,why:'受激发射沿相干路径放大，谱线远窄于热运动预期。'}
  ]},
 {name:'CO(1-0)',tc:'#82b1ff',wave:'115 GHz',wl:'2.6×10³ μm（115 GHz）',band:'mm',pos:17,profile:[{p:1,c:0.5,w:0.34,a:0.95}],
  desc:'CO 转动跃迁 J=1→0，冷分子气体最重要的示踪剂；典型轮廓呈抛物线形。',tip:'分子气体质量',lw:'云核 ~5 km/s；星系积分谱由转动致宽至数百 km/s',traces:'冷分子气体（H₂ 的替身示踪剂）',apply:'换算星系分子气体质量，检验恒星形成定律',fact:'H₂ 无偶极矩几乎不发光，CO 替它"代言"',
  quiz:[

function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}

function evenCounts(weights,total){
 const n=weights.length;
 if(total<2*n)return null;
 const cnt=weights.map(()=>2);
 const rem=total-2*n;
 const sumW=weights.reduce((a,b)=>a+b,0);
 const exact=weights.map(w=>rem*w/sumW);
 const add=weights.map(w=>2*Math.floor(rem*w/sumW/2));
 let got=add.reduce((a,b)=>a+b,0);
 const order=weights.map((w,j)=>j).sort((a,b)=>exact[b]-exact[a]);
 let i=0;
 while(got<rem){add[order[i%order.length]]+=2;got+=2;i++;}
 return cnt.map((c,j)=>c+add[j]);
}
function levelDeck(lvl){
 const bs=boardSize(lvl),total=bs[0]*bs[1];
 const nl=LINE_ORDER[lvl-1];
 const prev=LINE_ORDER.slice(0,lvl-1);
 const cnt=evenCounts(prev.map(()=>1).concat([2]),total);
 const vals=[];
 for(let i=0;i<prev.length;i++)for(let k=0;k<cnt[i];k++)vals.push(prev[i]);
 for(let k=0;k<cnt[prev.length];k++)vals.push(nl);
 return shuffleArr(vals);
}

function profilePath(comps){
 const N=120,x0=3,x1=61,yb=31,K=24;let d='';
 for(let i=0;i<=N;i++){
  const u=i/N;let f=0;
  for(const m of comps){
   if(m.g)f+=m.a*Math.exp(-((u-m.c)*(u-m.c))/(2*m.w*m.w));
   else if(m.s)f+=m.a*Math.exp(-Math.pow((u-m.c)/m.w,4));
   else if(m.d)f-=m.a*Math.exp(-((u-m.c)*(u-m.c))/(2*m.w*m.w));
   else if(m.l)f-=m.a/(1+Math.pow((u-m.c)/m.w,2));
   else if(m.p){const t=(u-m.c)/m.w;if(Math.abs(t)<1)f+=m.a*(1-t*t);}
   else if(m.k)f+=m.b+m.a*Math.exp(-m.e*u);
  }
  f=Math.max(-1.25,Math.min(1.2,f));
  const Y=Math.max(3.5,Math.min(37.5,yb-f*K));
  d+=(i?'L':'M')+(x0+u*(x1-x0)).toFixed(1)+' '+Y.toFixed(1);
 }
 return d;
}

function segClear(p,q){
 if(p[0]===q[0]){const lo=Math.min(p[1],q[1]),hi=Math.max(p[1],q[1]);for(let c=lo+1;c<hi;c++)if(grid[p[0]][c]!==null)return false;return true;}
 if(p[1]===q[1]){const lo=Math.min(p[0],q[0]),hi=Math.max(p[0],q[0]);for(let r=lo+1;r<hi;r++)if(grid[r][p[1]]!==null)return false;return true;}
 return false;
}
function free(p,a,b){if(p[0]===a[0]&&p[1]===a[1])return true;if(p[0]===b[0]&&p[1]===b[1])return true;return grid[p[0]][p[1]]===null;}
function findPath(a,b){
 if(segClear(a,b))return [a,b];
 const c1=[a[0],b[1]],c2=[b[0],a[1]];
 if(free(c1,a,b)&&segClear(a,c1)&&segClear(c1,b))return [a,c1,b];
 if(free(c2,a,b)&&segClear(a,c2)&&segClear(c2,b))return [a,c2,b];
 for(let r=0;r<R;r++){const p1=[r,a[1]],p2=[r,b[1]];
  if(free(p1,a,b)&&free(p2,a,b)&&segClear(a,p1)&&segClear(p1,p2)&&segClear(p2,b))return [a,p1,p2,b];}
 for(let c=0;c<C;c++){const p1=[a[0],c],p2=[b[0],c];
  if(free(p1,a,b)&&free(p2,a,b)&&segClear(a,p1)&&segClear(p1,p2)&&segClear(p2,b))return [a,p1,p2,b];}
 return null;
}
function gridPair(){
 const pos={};
 for(let r=1;r<=ROWS;r++)for(let c=1;c<=COLS;c++){const v=grid[r][c];if(v!==null){if(!pos[v])pos[v]=[];pos[v].push([r,c]);}}
 for(const k in pos){const arr=pos[k];
  for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++)if(findPath(arr[i],arr[j]))return [arr[i],arr[j]];}
 return null;
}
function hintPair(){
 const by={};
 for(const t of tiles){if(!t.alive)continue;if(!by[t.line])by[t.line]=[];by[t.line].push(t);}
 for(const k in by){const arr=by[k];
  for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++)if(findPath([arr[i].r,arr[i].c],[arr[j].r,arr[j].c]))return [arr[i],arr[j]];}
 return null;
}

function buildBoard(vals,rows,cols){
 ROWS=rows;COLS=cols;R=rows+2;C=cols+2;

 do{shuffleArr(vals);let idx=0;for(let r=1;r<=ROWS;r++)for(let c=1;c<=COLS;c++)grid[r][c]=vals[idx++];tries++;}
 while(!gridPair()&&tries<500);
 tiles=[];sel=null;
 relayout();
 let idx=0;
 for(let r=1;r<=ROWS;r++)for(let c=1;c<=COLS;c++){
  const t={line:grid[r][c],r:r,c:c,alive:true,el:document.createElement('div')};

function eliminate(a,b,path){

 a.alive=false;b.alive=false;
 a.el.classList.remove('sel');b.el.classList.remove('sel');
 a.el.classList.add('dead');b.el.classList.add('dead');
 drawPath(path,BANDS[LINES[a.line].band].color);
 const now=Date.now();
 combo=(now-lastMatch<6000)?combo+1:1;
 lastMatch=now;maxCombo=Math.max(maxCombo,combo);

 beep(f,0.06,'sine',0.05);setTimeout(()=>beep(f*1.26,0.09,'sine',0.05),60);
 pairsLeft--;updateHUD();
 if(pairsLeft===0){if(mode==='challenge')winChallenge();else winLevel();return;}

function doShuffle(auto){

 let guard=0;
 do{

  alive.forEach((t,i)=>{t.line=vs[i];grid[t.r][t.c]=vs[i];renderTile(t);});
  guard++;
 }while(!gridPair()&&guard<400);
 if(!auto){shufflesLeft--;updateHUD();toast('已洗牌');}
 alive.forEach(t=>{t.el.classList.remove('pop');void t.el.offsetWidth;t.el.classList.add('pop');});
}

function beep(freq,dur,type,gain,delay){
 if(!soundOn)return;
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  const t0=audioCtx.currentTime+(delay||0);
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type||'sine';o.frequency.value=freq;
  g.gain.setValueAtTime(gain||0.04,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+(dur||0.08));
  o.connect(g);g.connect(audioCtx.destination);
  o.start(t0);o.stop(t0+(dur||0.08)+0.03);
 }catch(e){}
}

function setZoom(z){
 zoom=Math.max(0.6,Math.min(1.6,Math.round(z*10)/10));
 save.zoom=zoom;persist();relayout();
 toast('卡片 '+Math.round(zoom*100)+'%');
}
function resetProgress(){
 if(!confirm('确定重置全部进度吗？'))return;
 save={v:1,stars:{},won:{},best:0,sound:soundOn};
 persist();renderMenu();toast('进度已重置');
}
function newGame(){
 if(mode==='challenge')startChallenge();else startLevel(curLevel);
}
function init(){
 boardBox=document.getElementById('boardBox');
 pathLayer=document.getElementById('pathLayer');
 legend=document.getElementById('legend');
 toastEl=document.getElementById('toast');
 spTarget=document.getElementById('spTarget');
 spLeft=document.getElementById('spLeft');
 hTime=document.getElementById('hTime');
 hLeft=document.getElementById('hLeft');
 hScore=document.getElementById('hScore');
 hCombo=document.getElementById('hCombo');
 btnHint=document.getElementById('btnHint');
 btnShuffle=document.getElementById('btnShuffle');
 btnSound=document.getElementById('btnSound');
 btnNames=document.getElementById('btnNames');
 btnZoomIn=document.getElementById('btnZoomIn');
 btnZoomOut=document.getElementById('btnZoomOut');
 btnRestart=document.getElementById('btnRestart');
 btnBack=document.getElementById('btnBack');
 gTitle=document.getElementById('gTitle');
 gSub=document.getElementById('gSub');
 btnPlay=document.getElementById('btnPlay');
 btnAtlas=document.getElementById('btnAtlas');
 btnChallenge=document.getElementById('btnChallenge');
 btnSoundM=document.getElementById('btnSoundM');
 btnReset=document.getElementById('btnReset');
 mProg=document.getElementById('mProg');
 mGrid=document.getElementById('mGrid');
 crCard=document.getElementById('crCard');
 crGo=document.getElementById('crGo');
 qStep=document.getElementById('qStep');
 qScore=document.getElementById('qScore');
 qText=document.getElementById('qText');
 qOpts=document.getElementById('qOpts');
 qWhy=document.getElementById('qWhy');
 qNext=document.getElementById('qNext');
 atProg=document.getElementById('atProg');
 atGrid=document.getElementById('atGrid');
 atClose=document.getElementById('atClose');
 dtCard=document.getElementById('dtCard');
 dtBtns=document.getElementById('dtBtns');
 rTitle=document.getElementById('rTitle');
 rBody=document.getElementById('rBody');
 rBtns=document.getElementById('rBtns');
 save=loadSave();
 soundOn=save.sound!==false;
 zoom=(typeof save.zoom==='number')?save.zoom:1;
 buildLegend();
 btnPlay.addEventListener('click',()=>startLevel(firstUnwon()));
 btnAtlas.addEventListener('click',openAtlas);
 btnChallenge.addEventListener('click',startChallenge);
 btnSoundM.addEventListener('click',toggleSound);
 btnReset.addEventListener('click',resetProgress);
 btnHint.addEventListener('click',doHint);
 btnShuffle.addEventListener('click',()=>{if(shufflesLeft<=0){toast('洗牌次数已用完');return;}doShuffle(false);});
 btnSound.addEventListener('click',toggleSound);
 btnNames.addEventListener('click',()=>setNames(!namesOn));
 btnZoomIn.addEventListener('click',()=>setZoom(zoom+0.1));
 btnZoomOut.addEventListener('click',()=>setZoom(zoom-0.1));
 btnRestart.addEventListener('click',newGame);
 btnBack.addEventListener('click',showMenu);
 qNext.addEventListener('click',()=>{quiz.i++;if(quiz.i<quiz.qs.length)renderQ();else quizDone();});
 atClose.addEventListener('click',()=>hideEl(atlasOvl));
 window.addEventListener('resize',relayout);
 updateSoundBtns();
 renderMenu();
}
if(typeof document!=='undefined'){init();}
else{
 let bad=0;const A=(c,m)=>{console.assert(c,m);if(!c)bad++;};
 grid=emptyGrid();
 grid[1][1]=0;grid[1][5]=0;
 A(JSON.stringify(findPath([1,1],[1,5]))==='[[1,1],[1,5]]','T1 straight');
 grid[3][3]=0;
 A(findPath([1,1],[3,3])&&findPath([1,1],[3,3]).length===3,'T2 one turn');
 grid[1][3]=1;grid[3][1]=1;
 A(findPath([1,1],[3,3])&&findPath([1,1],[3,3]).length===4,'T3 two turns');
 grid=emptyGrid();
 grid[1][1]=0;grid[1][8]=0;grid[1][4]=1;
 const t4=findPath([1,1],[1,8]);
 A(t4&&t4.length===4&&t4.some(p=>p[0]===0),'T4 border route');
 grid=emptyGrid();
 grid[1][1]=0;grid[1][3]=0;
 for(let r=0;r<=2;r++)for(let c=0;c<=4;c++){if((r===1&&c===1)||(r===1&&c===3))continue;grid[r][c]=1;}
 A(findPath([1,1],[1,3])===null,'T5 no path');
 A(LINES.length===20,'T6 catalog size');
 for(let i=0;i<LINES.length;i++){const L=LINES[i];
  A(BANDS[L.band]!==undefined,'T7 band '+L.name);
  A(typeof L.desc==='string'&&L.desc.length>0,'T7 desc '+L.name);
  A(typeof L.lw==='string'&&L.lw.length>0,'T7 lw '+L.name);
  A(typeof L.traces==='string'&&L.traces.length>0,'T7 traces '+L.name);
  A(typeof L.apply==='string'&&L.apply.length>0,'T7 apply '+L.name);
  A(typeof L.fact==='string'&&L.fact.length>0,'T7 fact '+L.name);
  A(typeof L.tip==='string'&&L.tip.length>0,'T7 tip '+L.name);
  A(typeof L.wl==='string'&&L.wl.length>0,'T7 wl '+L.name);
  A(L.quiz.length>=3,'T7 quiz len '+L.name);
  const seen={};
  for(const q of L.quiz){
   A(q.opts&&q.opts.length===4,'T7 opts '+L.name);
   A(typeof q.ans==='number'&&q.ans>=0&&q.ans<4,'T7 ans '+L.name);
   A(typeof q.why==='string'&&q.why.length>0,'T7 why '+L.name);
   A(!seen[q.q],'T7 dup q '+L.name);seen[q.q]=1;
  }
  const d=profilePath(L.profile);
  A(d.charAt(0)==='M'&&d.indexOf('L')>0,'T8 profile '+L.name);
  A(L.pos>=0&&L.pos<=100,'T9 pos '+L.name);
 }
 A(LINE_ORDER.length===LINES.length,'T10 order len');
 A(LINE_ORDER.slice().sort((a,b)=>a-b).every((v,i)=>v===i),'T10 perm');
 A(CHAPTERS[CHAPTERS.length-1].b===LINES.length,'T10 chapters cover');
 A(LINES.every(L=>typeof L.tc==='string'&&/^#[0-9a-fA-F]{6}$/.test(L.tc)),'T13 tc format');
 const byBand={};
 for(const L of LINES){(byBand[L.band]=byBand[L.band]||[]).push(L.tc);}
 for(const k in byBand)A(new Set(byBand[k]).size===byBand[k].length,'T13 tc unique in '+k);
 for(let l=1;l<=LINES.length;l++){
  const bs=boardSize(l),total=bs[0]*bs[1];
  const prev=LINE_ORDER.slice(0,l-1);
  const cnt=evenCounts(prev.map(()=>1).concat([2]),total);
  A(cnt&&cnt.length===l,'T11 cnt len '+l);
  let sum=0,mx=0;
  for(let i=0;i<cnt.length;i++){A(cnt[i]%2===0&&cnt[i]>=2,'T11 even '+l);sum+=cnt[i];if(i<prev.length&&cnt[i]>mx)mx=cnt[i];}
  A(sum===total,'T11 sum '+l);
  A(cnt[prev.length]>=mx,'T11 new dominant '+l);
  A(levelDeck(l).length===total,'T11 deck '+l);
 }
 ROWS=6;COLS=6;R=8;C=8;
 grid=emptyGrid();
 let deck=levelDeck(5),idx=0;
 for(let r=1;r<=ROWS;r++)for(let c=1;c<=COLS;c++)grid[r][c]=deck[idx++];
 let removed=0,reshuffles=0,guard=0;
 while(removed<36&&guard<20000){
  guard++;
  const mv=gridPair();
  if(mv){grid[mv[0][0]][mv[0][1]]=null;grid[mv[1][0]][mv[1][1]]=null;removed+=2;}
  else{deck=levelDeck(5);idx=0;for(let r=1;r<=ROWS;r++)for(let c=1;c<=COLS;c++)grid[r][c]=deck[idx++];reshuffles++;}
 }
 A(removed===36,'T12 sim completion');
 console.log('SELF-TEST '+(bad?'FAILED bad='+bad:'OK')+' · sim removed='+removed+' reshuffles='+reshuffles+' iters='+guard);
 if(typeof process!=='undefined')process.exitCode=bad?1:0;
}
